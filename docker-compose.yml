services:
  postgres:
    image: postgres:16-alpine
    container_name: nemo_mcp_guardrails_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nemo_mcp_guardrails}
      POSTGRES_USER: ${POSTGRES_USER:-nemo_mcp_guardrails}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemo_mcp_guardrails_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: nemo_mcp_guardrails_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-pgadmin_dev_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nemo_mcp_guardrails_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nemo_mcp_guardrails}:${POSTGRES_PASSWORD:-nemo_mcp_guardrails_dev_password}@postgres:5432/${POSTGRES_DB:-nemo_mcp_guardrails}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      GITHUB_MCP_READ_ONLY: ${GITHUB_MCP_READ_ONLY:-1}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/gms
    container_name: nemo_mcp_guardrails_frontend
    restart: unless-stopped
    environment:
      GMS_API_BASE_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
