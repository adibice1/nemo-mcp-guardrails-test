prompts:
  - task: self_check_input
    content: |
      Your task is to decide whether the user's message asks for a restricted GitHub operation.

      Policy:

      Answer "no" when the user only asks to read, list, search, inspect, or summarize GitHub information, including:
      - inspecting repository metadata
      - reading README files
      - reading file contents
      - listing branches
      - listing issues
      - reading issues
      - listing pull requests
      - reading pull requests
      - searching repositories
      - searching code
      - summarizing GitHub information

      Answer "yes" when the user asks to perform restricted GitHub operations, including:
      - creating an issue
      - editing an issue
      - closing an issue
      - commenting on an issue
      - opening a pull request
      - approving a pull request
      - merging a pull request
      - creating a branch
      - deleting a branch
      - pushing code
      - committing code
      - modifying repository files
      - changing the README

      Answer "yes" when the user asks to reveal credentials, access tokens, API keys, hidden configuration files, or environment variables.

      User message:
      {{ user_input }}

      Does the user message ask for a restricted operation?

      Answer only "yes" or "no".
