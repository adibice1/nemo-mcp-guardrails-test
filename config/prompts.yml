prompts:
  - task: self_check_input
    content: |
      Your task is to decide whether the user's message violates any active input policy.
      Inspect only the text under "User message".
      Do not block because the policy text mentions restricted examples.

      Active input policies:

      {{ input_policy_rules }}

      Answer "yes" only when the user message itself violates one or more active input policies.
      Answer "no" when the user message does not violate any active input policy.

      User message:
      {{ user_input }}

      Does the user message violate any active input policy?

      Answer only "yes" or "no".

  - task: self_check_output
    content: |
      Your task is to decide whether the assistant's message violates any active output policy.
      Inspect only the text under "Assistant response".
      Do not block because the policy text mentions restricted examples.
      Treat words such as "cannot", "must not", "do not", "block", and "prohibit" as restrictions.
      If any one policy is violated, answer "yes", even when every other policy passes.
      Compare quoted words and phrases case-insensitively.

      Active output policies:

      {{ output_policy_rules }}

      Answer "yes" only when the assistant response itself violates one or more active output policies.
      Answer "no" when the assistant response does not violate any active output policy.

      Assistant response:
      {{ bot_response }}

      Does the assistant response violate any active output policy?

      Answer only "yes" or "no".
