prompts:
  - task: self_check_input
    content: |
      Your task is to decide whether the user's message asks for a restricted GitHub operation.

      Policy:

      Dynamic database policy rules:
      {{ input_policy_rules }}

      Answer "no" when the user only asks to read, list, search, inspect, or summarize GitHub information, including:
      - inspecting repository metadata
      - reading README files
      - reading file contents
      - listing branches
      - listing issues
      - reading issues
      - listing pull requests
      - reading pull requests
      - searching repositories
      - searching code
      - summarizing GitHub information

      Answer "yes" when the user asks to perform restricted GitHub operations, including:
      - creating an issue
      - editing an issue
      - closing an issue
      - commenting on an issue
      - opening a pull request
      - approving a pull request
      - requesting changes on a pull request
      - submitting a pull request review
      - merging a pull request
      - creating a branch
      - deleting a branch
      - pushing code
      - committing code
      - modifying repository files
      - changing the README

      Answer "yes" when the user asks to reveal credentials, access tokens, API keys, hidden configuration files, or environment variables.

      User message:
      {{ user_input }}

      Does the user message ask for a restricted operation?

      Answer only "yes" or "no".

  - task: self_check_output
    content: |
      Your task is to decide whether the assistant's message should be blocked.

      Policy:

      Dynamic database policy rules:
      {{ output_policy_rules }}

      Answer "no" when the assistant response only contains normal GitHub repository information, summaries, branch names, issue metadata, pull request metadata, or safe refusal text.

      Answer "yes" when the assistant response reveals credentials, access tokens, API keys, hidden configuration files, .env contents, or environment variables.

      Assistant response:
      {{ bot_response }}

      Does the assistant response reveal restricted information?

      Answer only "yes" or "no".
